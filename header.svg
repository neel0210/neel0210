<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="220" rx="16" fill="url(#grid)"/>

  <!-- Glow effect -->
  <circle cx="450" cy="70" r="120" fill="#8b5cf6" fill-opacity="0.12" filter="blur(40px)"/>

  <!-- Border -->
  <rect x="1" y="1" width="898" height="218" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="95" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="2">
    Neel
  </text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="3">
    TECH ENTHUSIAST • SYSTEMS &amp; CREATIVE TOOLS
  </text>

  <!-- Accent Line -->
  <path d="M 250 162 L 650 162" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- Location / Tagline -->
  <text x="450" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748b" letter-spacing="1.5">
    Toronto, Canada 🍁
  </text>
</svg>
